<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuizFuzion | Result</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f4f6f9;
    color: #263445;
}

header {
    height: 82px;
    background: #14263d;
    border-bottom: 3px solid #18a999;
    padding: 0 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 5px 18px rgba(20, 38, 61, 0.10);
}

.brand {
    color: #ffffff;
    text-decoration: none;
    font-size: 25px;
    font-weight: 800;
}

.brand span {
    color: #35c6b1;
}

nav ul {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 30px;
}

nav a {
    color: #e6edf5;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
}

nav a:hover{
    color: #49d6c1;
}

h1 {
    color: #14263d;
    font-size: 44px;
    margin-bottom: 18px;
}

.hero p {
    color: #58697c;
    font-size: 18px;
    max-width: 650px;
    margin: 0 auto;
}

.actions {
    margin-top: 30px;
}


.button {
    display: inline-block;
    padding: 13px 25px;
    border-radius: 6px;
    background: #138b80;
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    cursor:pointer;
    box-shadow: 0 5px 12px rgba(19, 139, 128, 0.18);
}

.button:hover{
    background: #0e746b;
}

.container {
    width: 1040px;
    margin: 54px auto;
    padding: 42px 48px;
    background: #ffffff;
    border: 1px solid #e0e6ed;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(20, 38, 61, 0.07);
}

.container h1 {
    font-size: 34px;
    margin-bottom: 24px;
}

.container h2 {
    color: #14263d;
    margin-bottom: 12px;
}

.container p {
    color: #58697c;
    font-size: 16px;
}

.section-label {
    color: #138b80;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
}

.instruction-list {
    margin: 18px 0 28px;
    padding-left: 24px;
    color: #46576a;
}

.instruction-list li {
    padding: 8px 0 8px 5px;
    border-bottom: 1px solid #edf1f5;
}

.instruction-list li::marker {
    color: #138b80;
    font-weight: 800;
}

.question {
    padding: 22px 24px;
    margin-bottom: 18px;
    background: #fbfcfe;
    border: 1px solid #e1e7ee;
    border-left: 4px solid #138b80;
    border-radius: 8px;
    color: #46576a;
}

.question p {
    color: #172b43;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 10px;
}

.question label {
    display: block;
    padding: 4px 0;
    cursor: pointer;
}

.submit-btn {
    text-align: center;
    margin-top: 30px;
}

.result {
    width: 900px;
    margin: 70px auto;
    padding: 65px 50px;
    background: #ffffff;
    border: 1px solid #e0e6ed;
    border-top: 5px solid #138b80;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 12px 32px rgba(20, 38, 61, 0.07);
}

.result h1 {
    color: #138b80;
    font-size: 36px;
}

.result h2 {
    color: #14263d;
    font-size: 27px;
    margin: 12px 0;
}

.result p {
    color: #58697c;
}

.footer {
    margin-top: 65px;
    padding: 22px;
    text-align: center;
    color: #718096;
    font-size: 13px;
    border-top: 1px solid #dfe6ee;
}

    </style>
</head>
<body>
<header class="header">
    <a class="brand" href="home.html">Quiz<span>Fuzion</span></a>
    <nav>
        <ul>
            <li><a class="" href="home.html">Home</a></li>
            <li><a class="" href="instruction.html">Instructions</a></li>
            <li><a class="" href="quiz.html">Quiz</a></li>
            <li><a class="" href="result.html">Result</a></li>
            <li><a class="" href="aboutus.html">About Us</a></li>
        </ul>
    </nav>
</header>

<main class="result">
    <div class="section-label">Quiz complete</div>
    <h1>Quiz Submitted Successfully!</h1>
    <h2>Your Score: 8 / 10</h2>
    <p>Thank you for taking the quiz.</p>
    <div class="actions">
        <a class="button" href="quiz.html">Try Again</a>
    </div>
</main>

<footer class="footer">© QuizFuzion · Learn, practise, improve.</footer>
</body>
</html>
